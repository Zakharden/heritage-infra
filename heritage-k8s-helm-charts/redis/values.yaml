redis:
  architecture: standalone

  auth:
    enabled: true
    password: change-me-redis-password

  master:
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    persistence:
      enabled: true
      storageClass: local-path
      size: 2Gi

  replica:
    replicaCount: 0
