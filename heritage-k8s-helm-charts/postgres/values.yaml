global:
  # Bitnami removed most semver tags from Docker Hub; the Bitnami Helm charts
  # still reference semver tags like `17.6.0-debian-12-r4`.
  #
  # The same images are available on AWS Public ECR with those tags, so we use it
  # as the default registry to avoid `ImagePullBackOff` / `not found`.
  imageRegistry: public.ecr.aws
  security:
    # Bitnami charts validate image registries; when using a mirror (ECR) we must
    # explicitly allow it, otherwise Helm template fails at NOTES.txt.
    allowInsecureImages: true

postgresql:
  architecture: replication

  auth:
    enablePostgresUser: true
    username: app_user
    database: app_db
    existingSecret: heritage-postgres-auth
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
      replicationPasswordKey: replication-password

  primary:
    resources:
      requests:
        cpu: 250m
        memory: 2Gi
      limits:
        cpu: "1"
        memory: 2Gi
    persistence:
      enabled: true
      storageClass: local-path
      size: 2Gi

  readReplicas:
    replicaCount: 1
    resources:
      requests:
        cpu: 250m
        memory: 2Gi
      limits:
        cpu: "1"
        memory: 2Gi
    persistence:
      enabled: true
      storageClass: local-path
      size: 2Gi
